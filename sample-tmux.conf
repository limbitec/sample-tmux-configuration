# ==============================================================================
# TMUX PRODUCTION CONFIG (macOS + Neovim Optimized)
# Location: ~/.config/tmux/tmux.conf
# ==============================================================================

# ==============================================================================
# 1. CORE SETTINGS
# ==============================================================================

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Performance & UX
set -s escape-time 0
set -g repeat-time 300
set -g history-limit 200000
set -g mouse on
set -g set-clipboard on
set -g detach-on-destroy off

# Indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Shell
set -g default-shell /bin/zsh

# Terminal & True Color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ==============================================================================
# 2. SPLITS (Stay in Current Directory)
# ==============================================================================

unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ==============================================================================
# 3. PANE NAVIGATION (Vim Style)
# ==============================================================================

# Prefix + hjkl → Navigate panes
unbind h; unbind j; unbind k; unbind l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix + HJKL → Resize panes
unbind H; unbind J; unbind K; unbind L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Optional: Alt + hjkl (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Maximize pane
bind -r m resize-pane -Z

# ==============================================================================
# 4. WINDOW NAVIGATION
# ==============================================================================

bind -r C-h previous-window
bind -r C-l next-window

# Quick reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded"

# ==============================================================================
# 5. COPY MODE (Vim Style)
# ==============================================================================

setw -g mode-keys vi

# Begin selection with v
bind -T copy-mode-vi v send -X begin-selection

# Copy with y (macOS clipboard)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Paste buffer
bind P paste-buffer

# Prevent exiting copy mode on mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================================================
# 6. UI & STATUS BAR
# ==============================================================================

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style "fg=colour39"

# Status bar
set -g status-interval 5
set -g status-justify centre
# set -g status-bg olive
# set -g status-fg white

set -g status-style "bg=olive,fg=white,bold"

# set -g status-style "bg=olive,fg=white"

set -g status-left "#[bold]#S#[default] "
set -g status-right "#[bold]%Y-%m-%d %H:%M#[default]"


# set -g status-left "#[bold]#S #[default]"
# set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M "

# Auto rename windows by current folder
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# ==============================================================================
# 7. TPM & PLUGINS
# ==============================================================================

# Plugin manager
# set -g @plugin 'tmux-plugins/tpm'

# Seamless navigation between tmux and Neovim
# set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# CPU + memory monitor
# set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Restore settings
# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TPM (KEEP THIS LAST)
run '~/.tmux/plugins/tpm/tpm'